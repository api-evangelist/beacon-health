aid: beacon-health
name: Beacon Health
description: >-
  Beacon Health (YC W26) is a San Francisco company building "AI employees" for
  primary care — autonomous agents that operate directly inside electronic health
  record systems the same way a human staff member does. Rather than integrating
  through an EHR vendor API, Beacon records a practice's existing workflow in the
  EHR (navigation, clicks, data entry) and converts that recording into a
  reusable, deployable agent that runs at scale across the whole patient panel.
  The agents automate value-based-care back-office work: preventative and quality
  gap closure, pre-charting, prior authorizations, referrals, transition-of-care
  management, and HCC risk-adjustment coding. Beacon advertises coverage of
  AthenaHealth, Epic, Cerner, eClinicalWorks, MEDITECH, NextGen, Veradigm
  Allscripts and MEDENT, plus payer portals and other web applications. Founded
  in 2025 by Mark Pothen (CEO) and Obinna Akahara (CTO), the company operates as
  a HIPAA Business Associate under a BAA with each covered entity, and publishes
  a trust center at trust.beaconhealth.ai carrying a 56-control monitored control
  set, a named eight-vendor subprocessor list, and SOC 2 and HIPAA frameworks both
  declared in progress with no completed attestation. As of this profile Beacon
  Health publishes no public developer API, developer portal, API documentation,
  SDKs, or OpenAPI definition — the product is delivered as a managed agent
  workforce, not as a self-serve API.
