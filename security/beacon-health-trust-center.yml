# A SECOND trust center is linked from the company's own site and does not agree
# with the first. Recorded rather than resolved — we cannot read the Delve page.
second_trust_surface:
  url: https://trust.delve.co/beacon-health
  reached_via: https://www.beaconhealth.ai/security
  redirect: >-
    The Next.js route /security issues a server-side redirect
    (NEXT_REDIRECT;replace;https://trust.delve.co/beacon-health;307) rather than
    rendering a security page of its own.
  http_status: 429
  readable: false
  note: >-
    trust.delve.co is behind a Vercel Security Checkpoint bot challenge and
    answered 429 to every request, including with a browser user-agent. We do not
    evade challenges, so the Delve trust center's contents are unread. Beacon
    Health therefore has two trust surfaces — an Oneleet one on its own subdomain
    that nothing on the marketing site links to, and a Delve one that the site's
    own /security route points at. Which is authoritative is undetermined.

