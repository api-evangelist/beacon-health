    conforms: true
    evidence: >-
      Beacon Health states it processes Protected Health Information as a
      Business Associate under HIPAA and maintains administrative, physical and
      technical safeguards in accordance with the HIPAA Security Rule, with
      obligations governed by a Business Associate Agreement executed with each
      covered entity (Privacy Policy §4; Terms of Service §5). "HIPAA Compliant"
      is also asserted on the homepage.
  - id: hipaa-baa
    conforms: true
    evidence: >-
      "Our obligations regarding PHI are detailed in the Business Associate
