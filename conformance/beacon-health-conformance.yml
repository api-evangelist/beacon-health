description: >-
  Beacon Health publishes no OpenAPI definition and no public API, so nothing
  here is derived from a spec. Every entry below is grounded in a claim the
  company publishes on its own site or in a record observed live. Absence of a
  claim is recorded as conforms:false with the reason, not as a failure.
standards:
  - id: hipaa
    conforms: true
    evidence: >-
      Beacon Health states it processes Protected Health Information as a
      Business Associate under HIPAA and maintains administrative, physical and
      technical safeguards in accordance with the HIPAA Security Rule, with
      obligations governed by a Business Associate Agreement executed with each
      covered entity (Privacy Policy §4; Terms of Service §5). "HIPAA Compliant"
      is also asserted on the homepage.
  - id: hipaa-baa
    conforms: true
    evidence: >-
      "Our obligations regarding PHI are detailed in the Business Associate
      Agreement (BAA) executed with each covered entity." — Privacy Policy §4.
      Subprocessors handling PHI are also placed under BAAs (Privacy Policy §5).
      As of 2026-08-15 the trust center names the subprocessors: 8 in total, of
      which 2 are declared to process PII — Amazon Web Services (Patient
      Documents) and Convex (Application Data, Patient Data, Audit Logs). See
      security/beacon-health-trust-center.yml.
  - id: hipaa-security-rule-controls
    conforms: partial
    evidence: >-
      ADDED 2026-08-15. The trust center publishes a monitored control set mapped
      to a HIPAA Business Associate framework (declared IN_PROGRESS): 56 controls
      across 10 categories, 55 PASSING and 1 NEEDS_CHANGES. The one control not
      passing is "Adequate audit log storage maintained" (Monitoring & Incident
      Response), which is mapped to the HIPAA framework specifically. Encryption
      at rest and in transit, MFA on critical services, incident response policy,
      and annual penetration testing are all reported PASSING. This is the
      company's own self-attested control monitoring, not an audited result.
    source: security/beacon-health-trust-center.yml
  - id: pentest-annual
    conforms: true
    evidence: >-
      ADDED 2026-08-15. Trust center reports "Penetration testing performed within
      the last 12 months" and "Penetration testing findings remediated" both
      PASSING, mapped to SOC 2 and HIPAA. No pentest report or letter is
      published, so this is an assertion rather than reviewable evidence.
    source: security/beacon-health-trust-center.yml
  - id: subprocessor-disclosure
    conforms: true
    evidence: >-
      ADDED 2026-08-15. A named subprocessor list with per-vendor PII flags and
      service scope is published on the trust center — the disclosure a covered
      entity needs for HIPAA vendor diligence. Processing locations are left empty
      for every entry.
    source: security/beacon-health-trust-center.yml
  - id: oidc
    conforms: partial
    evidence: >-
      api.beaconhealth.ai serves a valid /.well-known/openid-configuration with
      an issuer and a working RSA JWKS, but the advertised
      authorization_endpoint returns 404 and no token endpoint is published — it
      is first-party application JWT metadata, not a usable OIDC provider for
      third parties.
  - id: oauth2
    conforms: false
    evidence: >-
      No reachable /oauth/authorize or /oauth/token, no
      /.well-known/oauth-authorization-server, and no published client
      registration or developer credentials.
  - id: soc2
    conforms: false
    status: in-progress
    evidence: >-
      UPGRADED 2026-08-15. Beacon Health now publishes a trust center at
      https://trust.beaconhealth.ai/ (its own subdomain, CNAMEd to
      trust.oneleet.com — the live counterpart of the
      "oneleet-domain-verification" TXT record recorded in the previous pass).
      The trust center lists SOC 2 with status IN_PROGRESS and soc2type UNSET.
      That is the company declaring an audit under way, not a certification: no
      Type I or Type II report, auditor name, or attestation letter is published,
      and the trust center offers no downloadable documents. conforms stays false;
      the program is recorded separately under compliance_program.
    source: security/beacon-health-trust-center.yml
